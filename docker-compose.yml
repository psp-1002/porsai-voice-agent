services:
  # Self-hosted text to speech: Kokoro-82M with an OpenAI-compatible API on :8880
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped

  # Local Postgres used only by the tests (port 5433 to avoid clashing with a local Postgres)
  testdb:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_test
    ports:
      - "5433:5432"
